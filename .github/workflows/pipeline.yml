name: Data pipeline

# Runs fetch_data.py -> build_gold.py -> fetch_marine_forecast.py every day,
# plus build_forecasts.py (SARIMA) on Sundays only — see the cadence note
# below. Order matters for fetch_data.py -> build_gold.py: Gold aggregates
# whatever's currently in silver_hourly, so it must run AFTER the fetch.
# fetch_marine_forecast.py and build_forecasts.py are both independent of
# each other and of build_gold.py (neither reads Gold), so their relative
# order doesn't matter for correctness — fetch_marine_forecast.py runs
# first anyway so Fisherman's live forecast (the one a user actually acts
# on) lands even if the slower SARIMA step hangs or fails on a Sunday run.
#
# Daily is the right cadence for fetch/Gold/marine-forecast, not more:
# archive-api/marine-api's own reanalysis data (ERA5/ERA5-Land, ERA5-Ocean)
# lags 5 days behind real time regardless of how often we ask, so running
# this more than once a day wouldn't get any data any fresher — see
# fetch_data.py's GLOBAL_END comment for the sources.
#
# build_forecasts.py (SARIMA) is now WEEKLY, not daily — measured at
# 37m39s on its own (reads/refits on full silver_hourly history every run,
# so this doesn't shrink as the catch-up backlog clears), by far the
# single biggest cost in this workflow. That cost bought its keep when its
# output fed Fisherman's live forecast; now that it only feeds the
# Analytics page's forecasting case study (see pipeline/build_forecasts.py
# and pages/analytics.py), there's no user-facing reason to refit it every
# single day — a case-study model demonstrating methodology doesn't go
# stale in 24h the way a live forecast would. Two schedule triggers below
# (Mon-Sat vs. Sun) plus a per-step `if` on github.event.schedule is the
# standard way to run most steps daily and one step weekly inside a single
# workflow, rather than needing a second workflow file.
on:
  schedule:
    # 20:07 UTC = ~01:37 Asia/Colombo (next day) — after the day's data has
    # a chance to be reanalyzed, off-peak for both Open-Meteo and Supabase.
    # Minute deliberately NOT :00 — GitHub's own docs warn the schedule
    # event "can be delayed during periods of high loads," and specifically
    # call out "the start of every hour" as a high-load time (every repo's
    # on-the-hour cron all queuing at once). A few minutes off that mark
    # avoids competing in that spike.
    - cron: "7 20 * * 1-6"  # Mon-Sat: fetch + Gold + marine forecast
    - cron: "7 20 * * 0"    # Sun: same, plus the SARIMA refit
  workflow_dispatch: {}

concurrency:
  group: coastalpulse-data-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Raised from 60 -> 90 after adding fetch_marine_forecast.py. A normal
    # Sunday run (the only day SARIMA also runs) tallies to roughly:
    # build_gold.py ~7min (measured) + build_forecasts.py ~38min (measured)
    # + fetch_marine_forecast.py ~1-3min (measured ~45s locally, CI network
    # adds some) + fetch_data.py (a few more minutes on a normal 1-month-
    # chunk day) — landing close enough to the old 60min ceiling to leave
    # almost no room for a bad-network day, which is exactly the scenario
    # this timeout exists to cover. Raising it costs nothing extra (Actions
    # bills actual runtime, not the ceiling) — plain insurance, not an
    # expected runtime.
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Python fully block-buffers stdout when it isn't a real terminal
      # (true for a GitHub Actions step, which captures output through a
      # pipe) — print() calls queue up silently instead of appearing live,
      # which made a run that was actually working fine (confirmed: data
      # was landing in Supabase the whole time) look hung with "no output"
      # for many minutes. This forces line-by-line flushing so the log
      # actually reflects progress in real time.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # numpy==2.5.1 (requirements-pipeline.txt, pinned to match
          # requirements.txt) requires Python >=3.12 — 3.11 fails to
          # resolve it even though pandas==3.0.3 installs fine under 3.11.
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Fetch latest data (Bronze -> Silver)
        working-directory: pipeline
        run: python fetch_data.py

      - name: Rebuild Gold aggregates
        working-directory: pipeline
        run: python build_gold.py

      - name: Refresh Fisherman forecast (Open-Meteo)
        working-directory: pipeline
        run: python fetch_marine_forecast.py

      # Weekly only (Sunday's cron, or any manual run) — see the cadence
      # note at the top of this file for why. github.event.schedule is only
      # set for scheduled runs, hence the separate workflow_dispatch check
      # so a manual trigger always includes this step too.
      - name: Refresh SARIMA forecasting case study (weekly)
        working-directory: pipeline
        if: github.event.schedule == '7 20 * * 0' || github.event_name == 'workflow_dispatch'
        run: python build_forecasts.py
